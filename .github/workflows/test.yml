name: Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # CI environment flags
  CI: true
  # Dummy env vars for build
  DATABASE_URL: "file:./test.db"
  DATABASE_AUTH_TOKEN: "test-token"
  BETTER_AUTH_SECRET: "test-secret-at-least-32-characters-long"
  BETTER_AUTH_URL: "http://localhost:3000"
  STRIPE_SECRET_KEY: "sk_test_dummy"
  STRIPE_WEBHOOK_SECRET: "whsec_test_dummy"
  NEXT_PUBLIC_API_URL: "http://localhost:3000"
  EXPO_PUBLIC_API_URL: "http://localhost:3000"

jobs:
  # ==========================================================================
  # Stage 1: Unit Tests - MUST pass before anything else
  # ==========================================================================
  unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================================================
  # Stage 2: Type Check & Lint - Quality gates
  # ==========================================================================
  quality:
    name: ✅ Quality Checks
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run build

      - name: Lint
        run: bun run lint
        continue-on-error: true # Don't fail on lint for now

      - name: Production Readiness Check (Rate Limiting)
        run: cd apps/backend && bun run check:ratelimit
        if: github.ref == 'refs/heads/main'

  # ==========================================================================
  # Stage 3: E2E Tests - Real integration validation
  # ==========================================================================
  e2e:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    needs: [unit, quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Create backend .env
        run: |
          cat > apps/backend/.env << 'EOF'
          DATABASE_URL="file:./test.db"
          DATABASE_AUTH_TOKEN="test-token"
          BETTER_AUTH_SECRET="test-secret-at-least-32-characters-long"
          BETTER_AUTH_URL="http://localhost:3000"
          STRIPE_SECRET_KEY="sk_test_dummy"
          STRIPE_WEBHOOK_SECRET="whsec_test_dummy"
          NEXT_PUBLIC_API_URL="http://localhost:3000"
          EXPO_PUBLIC_API_URL="http://localhost:3000"
          EOF

      - name: Run E2E tests
        run: bun run test:e2e:api
        timeout-minutes: 10

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ==========================================================================
  # Final: Status Check - All gates must pass
  # ==========================================================================
  status:
    name: 🚦 Pipeline Status
    runs-on: ubuntu-latest
    needs: [unit, quality, e2e]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.unit.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.quality.result }}" != "success" ]]; then
            echo "❌ Quality checks failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          echo "✅ All pipeline stages passed"
